[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyopensot-resources"
version = "5.0.0"
description = "Optional assets for pyopensot"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0 AND BSD-3-Clause"
license-files = [
  "LICENSE",
  "robots/**/LICENSE",
  "robots/**/NOTICE",
]

[project.urls]
Homepage = "https://github.com/hucebot/opensot_resources/"

[tool.hatch.build.targets.wheel]
force-include = { "robots" = "pyopensot_resources/robots" , "__init__.py" = "pyopensot_resources/__init__.py" }
